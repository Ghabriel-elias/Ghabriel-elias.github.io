<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta confirmada · Broto</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="180x180" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Broto">
      <svg viewBox="135 103 292 367" aria-hidden="true">
        <g transform="translate(256 306) scale(6.3529) translate(-38 -39)" fill="#3E6B4A">
          <path d="M38 39C38 22 30 15 20 9C34 12 41 23 42 34C44 20 53 12 64 8C52 17 45 26 44 39H38Z"/>
        </g>
        <g transform="translate(256 352)">
          <rect x="-108" y="-46" width="216" height="40" rx="14" fill="#B4522F"/>
          <path d="M-94 2 L94 2 L72 96 Q72 112 54 112 L-54 112 Q-72 112 -72 96 Z" fill="#C88B6A"/>
        </g>
      </svg>
      <span>Broto</span>
    </a>
  </div>
</header>

<main class="auth">
  <div class="auth-card">

    <div class="auth-state" data-state="checking" data-active>
      <div class="auth-spinner" role="status" aria-live="polite"></div>
      <p class="lede" id="checkingText"></p>
    </div>

    <div class="auth-state" data-state="ok">
      <div class="auth-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
      </div>
      <h1 id="okTitle"></h1>
      <p class="lede" id="okBody"></p>
      <a class="auth-open" id="okOpen" href="broto://"></a>
      <p class="auth-foot" id="okFoot"></p>
    </div>

    <div class="auth-state" data-state="bad">
      <div class="auth-badge is-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <h1 id="badTitle"></h1>
      <p class="lede" id="badBody"></p>
    </div>

  </div>
</main>

<script src="/auth.js"></script>
<script>
fill({
  checkingText: T.checking,
  okTitle: T.confirmTitle,
  okBody: T.confirmBody,
  okOpen: T.open,
  okFoot: T.foot,
  badTitle: T.badTitle,
  badBody: T.badBodyConfirm,
});

document.title = T.confirmTitle + " · Broto";

const { token, type, error } = readToken();

async function confirm() {
  const first = type || "email";
  const second = first === "signup" ? "email" : "signup";

  try {
    await verifyToken(token, first);
  } catch {
    await verifyToken(token, second);
  }
}

if (error || !token) {
  show("bad");
} else {
  confirm().then(() => show("ok")).catch(() => show("bad"));
}
</script>

</body>
</html>
