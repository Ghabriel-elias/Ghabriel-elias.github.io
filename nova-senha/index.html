<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha · Broto</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="180x180" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Broto">
      <svg viewBox="140 55 232 420" aria-hidden="true">
        <g transform="translate(256 320)" fill="#3E6B4A">
          <rect x="-10" y="-136" width="20" height="150" rx="10"/>
          <g transform="translate(0 -112)">
            <g transform="rotate(-54)"><path d="M0 0 C-56 -40.12 -40.32 -96.76 0 -118 C40.32 -96.76 56 -40.12 0 0 Z"/></g>
            <g transform="rotate(54)"><path d="M0 0 C-56 -40.12 -40.32 -96.76 0 -118 C40.32 -96.76 56 -40.12 0 0 Z"/></g>
            <path d="M0 0 C-58 -49.64 -41.76 -119.72 0 -146 C41.76 -119.72 58 -49.64 0 0 Z"/>
          </g>
        </g>
        <g transform="translate(256 352)">
          <rect x="-108" y="-46" width="216" height="40" rx="14" fill="#B4522F"/>
          <path d="M-94 2 L94 2 L72 96 Q72 112 54 112 L-54 112 Q-72 112 -72 96 Z" fill="#C88B6A"/>
        </g>
      </svg>
      <span>Broto</span>
    </a>
  </div>
</header>

<main class="auth">
  <div class="auth-card">

    <div class="auth-state" data-state="checking" data-active>
      <div class="auth-spinner" role="status" aria-live="polite"></div>
      <p class="lede" id="checkingText"></p>
    </div>

    <div class="auth-state" data-state="form">
      <svg class="auth-mark" viewBox="140 55 232 420" aria-hidden="true">
        <g transform="translate(256 320)" fill="#3E6B4A">
          <rect x="-10" y="-136" width="20" height="150" rx="10"/>
          <g transform="translate(0 -112)">
            <g transform="rotate(-54)"><path d="M0 0 C-56 -40.12 -40.32 -96.76 0 -118 C40.32 -96.76 56 -40.12 0 0 Z"/></g>
            <g transform="rotate(54)"><path d="M0 0 C-56 -40.12 -40.32 -96.76 0 -118 C40.32 -96.76 56 -40.12 0 0 Z"/></g>
            <path d="M0 0 C-58 -49.64 -41.76 -119.72 0 -146 C41.76 -119.72 58 -49.64 0 0 Z"/>
          </g>
        </g>
        <g transform="translate(256 352)">
          <rect x="-108" y="-46" width="216" height="40" rx="14" fill="#B4522F"/>
          <path d="M-94 2 L94 2 L72 96 Q72 112 54 112 L-54 112 Q-72 112 -72 96 Z" fill="#C88B6A"/>
        </g>
      </svg>
      <h1 id="formTitle"></h1>
      <p class="lede" id="formBody"></p>

      <form class="auth-form" id="form" novalidate>
        <div>
          <label class="auth-label" for="password" id="fieldLabel"></label>
          <span class="auth-field">
            <input id="password" name="password" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" required>
            <button class="auth-reveal" id="reveal" type="button"></button>
          </span>
        </div>

        <ul class="auth-rules" id="rules">
          <li data-rule="length"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg></i><span id="ruleLength"></span></li>
          <li data-rule="upper"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg></i><span id="ruleUpper"></span></li>
          <li data-rule="special"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg></i><span id="ruleSpecial"></span></li>
        </ul>

        <p class="auth-error" id="error" role="alert"></p>

        <button class="auth-submit" id="submit" type="submit" disabled></button>
      </form>
    </div>

    <div class="auth-state" data-state="done">
      <div class="auth-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg>
      </div>
      <h1 id="doneTitle"></h1>
      <p class="lede" id="doneBody"></p>
      <a class="auth-open" id="doneOpen" href="broto://"></a>
      <p class="auth-foot" id="doneFoot"></p>
    </div>

    <div class="auth-state" data-state="bad">
      <div class="auth-badge is-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <h1 id="badTitle"></h1>
      <p class="lede" id="badBody"></p>
    </div>

  </div>
</main>

<script src="/auth.js"></script>
<script>
fill({
  checkingText: T.checking,
  formTitle: T.resetTitle,
  formBody: T.resetBody,
  fieldLabel: T.field,
  reveal: T.show,
  ruleLength: T.ruleLength,
  ruleUpper: T.ruleUpper,
  ruleSpecial: T.ruleSpecial,
  submit: T.submit,
  doneTitle: T.doneTitle,
  doneBody: T.doneBody,
  doneOpen: T.open,
  doneFoot: T.foot,
  badTitle: T.badTitle,
  badBody: T.badBody,
});

document.title = T.resetTitle + " · Broto";

const input = document.getElementById("password");
const submit = document.getElementById("submit");
const reveal = document.getElementById("reveal");
const errorBox = document.getElementById("error");
const rules = document.getElementById("rules");

input.placeholder = T.placeholder;

let accessToken = null;

function refresh() {
  const checks = checkPassword(input.value);
  rules.querySelectorAll("li").forEach((item) => {
    item.classList.toggle("is-met", checks[item.dataset.rule]);
  });
  submit.disabled = !(checks.length && checks.upper && checks.special);
}

input.addEventListener("input", () => {
  errorBox.removeAttribute("data-active");
  refresh();
});

reveal.addEventListener("click", () => {
  const hidden = input.type === "password";
  input.type = hidden ? "text" : "password";
  reveal.textContent = hidden ? T.hide : T.show;
  input.focus();
});

document.getElementById("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (submit.disabled) return;

  submit.disabled = true;
  submit.textContent = T.saving;
  errorBox.removeAttribute("data-active");

  try {
    await setPassword(accessToken, input.value);
    show("done");
  } catch (err) {
    errorBox.textContent = friendlyError(err.message || "");
    errorBox.setAttribute("data-active", "");
    submit.textContent = T.submit;
    refresh();
  }
});

const { token, error } = readToken();

if (error || !token) {
  show("bad");
} else {
  verifyToken(token, "recovery")
    .then((session) => {
      accessToken = session.access_token;
      if (!accessToken) throw new Error("no_session");
      show("form");
      input.focus();
    })
    .catch(() => show("bad"));
}
</script>

</body>
</html>
